project:
  type: website
  output-dir: ../public/docs

bibliography: references.bib

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

website:
  title: "RailActive Documentation"
  repo-url: "https://github.com/railactive/railactive"
  repo-subdir: docs
  repo-actions: [edit, issue]
  navbar:
    left:
      - text: "← Back to Map App"
        href: "../"
      - text: "Overview"
        href: index.qmd
      - text: "Methodology"
        href: methods.qmd
      - text: "Uptake Modelling"
        menu:
          - text: "Decision Brief (Ox–Ux)"
            href: uptake_case_study.qmd
          - text: "Technical Appendix"
            href: uptake_appendix.qmd
      - text: "Data Dictionary"
        href: data_dictionary.qmd
      - text: "Data Inventory"
        href: data_inventory.qmd
    right:
      - icon: github
        href: "https://github.com/railactive/railactive"
        aria-label: GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    smooth-scroll: true
    code-fold: true
    comments:
      hypothesis: true
